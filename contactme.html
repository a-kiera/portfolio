        <div class="contact">
            <h1>Contact me</h1>
            <p>My inbox is always open - whether you wish to collaborate, have a question or just want to say hi!</p>
            <p>Get in touch here:</p>
            <form action="#contactme.html" method="POST">
                <label for="first-name">First Name</label>
                <input type="text" name="name" id="first-name" required>

                <label for="last-name">Last Name</label>
                <input type="text" name="name" id="last-name" required>

                <label for="email">Email Address</label>
                <input type="text" name="address" id="email" required>

                <label for="msg">Message</label>
                <textarea id="msg" name="message" rows="5" cols="30" required>
                </textarea>

                <br>
                <input type="submit" value="Send" class="submit">
            </form>
        </div>
